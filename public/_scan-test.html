<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>scan compare2</title></head>
<body>
<h3>Scan Compare 2</h3>
<input type="file" id="f" accept="image/*">
<button id="go">识别</button>
<canvas id="cv" style="max-width:400px"></canvas>
<pre id="out">-</pre>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const out = document.getElementById('out');
function log(s){ out.textContent += s + '\n'; }
document.getElementById('go').onclick = () => {
  out.textContent = '';
  const file = document.getElementById('f').files[0];
  if (!file) { out.textContent = 'NO_FILE'; return; }
  log('loaded ' + file.name + ' ' + file.size + 'B');
  const img = new Image();
  img.onload = async () => {
    log('image decoded ' + img.naturalWidth + 'x' + img.naturalHeight);
    const cv = document.getElementById('cv');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0);
    // 1) BarcodeDetector
    if ('BarcodeDetector' in window) {
      try {
        const det = new BarcodeDetector({ formats: ['ean_13','ean_8','code_128','code_39','code_93','upc_a','upc_e','qr_code'] });
        const codes = await det.detect(cv);
        log('BarcodeDetector: ' + JSON.stringify(codes.map(c=>c.rawValue)));
      } catch(e) { log('BarcodeDetector ERR: ' + e.message); }
    } else { log('BarcodeDetector: NOT SUPPORTED'); }
    // 2) jsQR
    try {
      const data = ctx.getImageData(0,0,cv.width,cv.height);
      const q = jsQR(data.data, data.width, data.height, { inversionAttempts: 'dontInvert' });
      log('jsQR: ' + (q ? q.data : 'null'));
    } catch(e) { log('jsQR ERR: ' + (e.message||e)); }
    // 3) html5-qrcode scanFile
    try {
      const qr = new Html5Qrcode('out', { verbose: false });
      const res = await qr.scanFile(file, false);
      log('html5-qrcode: ' + res);
    } catch(e) { log('html5-qrcode FAIL: ' + (e.message||e)); }
  };
  img.onerror = () => log('IMAGE DECODE ERROR');
  img.src = URL.createObjectURL(file);
};
</script>
</body></html>
