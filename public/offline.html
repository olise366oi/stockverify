<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>网络已断开 - StockVerify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .icon { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.7; color: #94a3b8; max-width: 320px; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #1e40af;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:active { background: #1d4ed8; }
    .hint { font-size: 12px; color: #64748b; margin-top: 16px; }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.6">
    <path d="M1 1l22 22" stroke-linecap="round"/>
    <path d="M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" stroke-linecap="round"/>
  </svg>
  <h1>网络已断开</h1>
  <p>扫码记录会先保存在手机本地（IndexedDB），联网后自动上传，一条都不会丢。</p>
  <button class="btn" onclick="retry()">重新连接</button>
  <p class="hint">请检查 WiFi / 移动网络，然后点击"重新连接"</p>
  <script>
    function retry() {
      if (navigator.onLine) {
        location.href = location.origin + '/';
      } else {
        // 监听网络恢复后自动跳回主页面
        window.addEventListener('online', function go() {
          window.removeEventListener('online', go);
          location.href = location.origin + '/';
        });
        document.querySelector('.hint').textContent = '检测到网络仍不可用，恢复后会自动跳回主页面…';
      }
    }
  </script>
</body>
</html>
